<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Icebreaker Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e5e5e0;
      padding: 2rem;
      width: 100%;
      max-width: 640px;
    }

    .header { margin-bottom: 1.75rem; }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 0.35rem;
    }

    .header p {
      font-size: 0.875rem;
      color: #666;
      line-height: 1.5;
    }

    .key-box {
      background: #f9f9f7;
      border: 1px solid #e5e5e0;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }

    .key-box label {
      font-size: 0.8rem;
      color: #666;
      display: block;
      margin-bottom: 0.5rem;
    }

    .key-box label a {
      color: #4a7cf7;
      text-decoration: none;
      margin-left: 6px;
    }

    .key-box label a:hover { text-decoration: underline; }

    .key-row { display: flex; gap: 8px; }

    input[type="password"], textarea {
      width: 100%;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 9px 12px;
      border: 1px solid #e0e0da;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus, textarea:focus {
      border-color: #4a7cf7;
    }

    textarea {
      resize: vertical;
      line-height: 1.6;
    }

    .key-status {
      font-size: 0.75rem;
      margin-top: 6px;
      display: none;
    }

    .key-status.success { color: #2e7d52; display: block; }
    .key-status.error   { color: #c0392b; display: block; }

    label.field-label {
      font-size: 0.8rem;
      color: #666;
      display: block;
      margin-bottom: 0.5rem;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      font-family: inherit;
      font-size: 0.875rem;
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid #d0d0ca;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover { background: #f2f2ef; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    button.primary {
      flex: 1;
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    button.primary:hover { background: #333; border-color: #333; }

    .error-msg {
      display: none;
      color: #c0392b;
      font-size: 0.85rem;
      margin-top: 0.75rem;
      padding: 10px 12px;
      background: #fdf0ef;
      border-radius: 8px;
      border: 1px solid #f5c6c2;
    }

    .results { display: none; margin-top: 1.5rem; }

    .result-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 1rem 1.25rem;
      margin-bottom: 10px;
      border: 1px solid #e8e8e3;
      border-radius: 12px;
      background: #fff;
    }

    .avatar {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
    }

    .result-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
      color: #1a1a1a;
    }

    .result-trivia {
      font-size: 0.875rem;
      color: #555;
      line-height: 1.65;
    }

    .footer {
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid #e8e8e3;
      font-size: 0.75rem;
      color: #aaa;
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #f0f0f0; }
      .card { background: #1c1c1c; border-color: #2e2e2e; }
      .header h1 { color: #f0f0f0; }
      .header p, label, .key-box label { color: #999; }
      .key-box { background: #161616; border-color: #2e2e2e; }
      input[type="password"], textarea { background: #1c1c1c; border-color: #3a3a3a; color: #f0f0f0; }
      input[type="password"]:focus, textarea:focus { border-color: #4a7cf7; }
      button { background: #1c1c1c; border-color: #3a3a3a; color: #f0f0f0; }
      button:hover { background: #2a2a2a; }
      button.primary { background: #f0f0f0; color: #111; border-color: #f0f0f0; }
      button.primary:hover { background: #d0d0d0; }
      .result-item { background: #1c1c1c; border-color: #2e2e2e; }
      .result-name { color: #f0f0f0; }
      .result-trivia { color: #aaa; }
      .footer { border-color: #2e2e2e; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>🧊 Team Icebreaker Agent</h1>
      <p>Enter your project team members to get a conversation-starting trivia fact for each person (great for project kickoffs!)</p>
    </div>

    <div class="key-box">
      <label>
        Gemini API Key (free)
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Get a free key →</a>
      </label>
      <div class="key-row">
        <input type="password" id="api-key" placeholder="Paste your Gemini API key here" />
        <button onclick="saveKey()">Save</button>
      </div>
      <p id="key-status" class="key-status"></p>
    </div>

    <label class="field-label">Team members (one per line or comma-separated)</label>
    <textarea id="names-input" rows="5" placeholder="e.g. Sarah, Marcus, Priya, James"></textarea>

    <div class="btn-row">
      <button class="primary" id="run-btn" onclick="generateTrivia()">✦ Generate icebreakers</button>
      <button onclick="clearAll()">Clear</button>
    </div>

    <div id="error-msg" class="error-msg"></div>
    <div id="results" class="results"></div>

    <div class="footer">Powered by Google Gemini · Free to use · No data stored</div>
  </div>

  <script>
    let geminiKey = '';

    function saveKey() {
      const val = document.getElementById('api-key').value.trim();
      const status = document.getElementById('key-status');
      if (!val) {
        status.textContent = 'Please paste a valid API key.';
        status.className = 'key-status error';
        return;
      }
      geminiKey = val;
      status.textContent = '✓ Key saved for this session.';
      status.className = 'key-status success';
    }

    function parseNames(raw) {
      return raw.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
    }

    function clearAll() {
      document.getElementById('names-input').value = '';
      document.getElementById('results').style.display = 'none';
      document.getElementById('error-msg').style.display = 'none';
    }

    function setLoading(loading) {
      const btn = document.getElementById('run-btn');
      btn.disabled = loading;
      btn.textContent = loading ? '⏳ Generating...' : '✦ Generate icebreakers';
    }

    const colorPalette = [
      { bg: '#EEF2FF', text: '#3730a3' },
      { bg: '#ECFDF5', text: '#065f46' },
      { bg: '#FFF7ED', text: '#9a3412' },
      { bg: '#EFF6FF', text: '#1e40af' },
      { bg: '#FDF4FF', text: '#7e22ce' },
      { bg: '#FFFBEB', text: '#92400e' },
      { bg: '#F0FDF4', text: '#166534' },
    ];

    function getColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colorPalette[Math.abs(hash) % colorPalette.length];
    }

    async function generateTrivia() {
      const errEl = document.getElementById('error-msg');
      const resultsEl = document.getElementById('results');
      errEl.style.display = 'none';
      resultsEl.style.display = 'none';

      if (!geminiKey) {
        errEl.textContent = 'Please enter and save your Gemini API key first.';
        errEl.style.display = 'block';
        return;
      }

      const names = parseNames(document.getElementById('names-input').value);
      if (names.length === 0) {
        errEl.textContent = 'Please enter at least one name.';
        errEl.style.display = 'block';
        return;
      }

      setLoading(true);

      const prompt = `You are a helpful icebreaker assistant for project managers. For each name below, produce one short, interesting piece of trivia (2–3 sentences max). It can be about the name's origin and meaning, a famous historical or pop-culture figure who shared the name, an interesting cultural connection, or a fun linguistic fact. Keep it warm, conversational, and suitable for a workplace team meeting. Vary the type of trivia across names.

Return ONLY a valid JSON array, no markdown, no backticks, no preamble. Format:
[{"name": "Sarah", "trivia": "..."}]

Names:
${names.join('\n')}`;

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.8, maxOutputTokens: 1200 }
            })
          }
        );

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || 'API error');

        const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const clean = raw.replace(/```json|```/g, '').trim();
        const items = JSON.parse(clean);
        renderResults(items);
      } catch (err) {
        errEl.textContent = 'Something went wrong: ' + (err.message || 'Check your API key and try again.');
        errEl.style.display = 'block';
      }

      setLoading(false);
    }

    function renderResults(items) {
      const resultsEl = document.getElementById('results');
      resultsEl.innerHTML = items.map(item => {
        const initials = item.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
        const { bg, text } = getColor(item.name);
        return `
          <div class="result-item">
            <div class="avatar" style="background:${bg}; color:${text};">${initials}</div>
            <div>
              <p class="result-name">${item.name}</p>
              <p class="result-trivia">${item.trivia}</p>
            </div>
          </div>`;
      }).join('');
      resultsEl.style.display = 'block';
    }
  </script>
</body>
</html>
